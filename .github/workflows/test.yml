name: Tests
on:
  pull_request:
  push:
    branches: [main, integracao-eupago]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: node --check public/app.js
      - run: node --check public/admin/admin.js
